name: CI

# Her dal itişinde ve PR'da kalite denetimleri ve uçtan uca test çalışır.
# macOS ve Windows kurulum paketleri burada (bulutta) derlenir; geliştirici bilgisayarı yük almaz.
# `v*` etiketi (örn. v0.1.0) itilince paketler bir GitHub Release olarak yayımlanır.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Kalite denetimleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee npm-ci.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=npm ci başarısız (çıkış $code)::$(grep -E 'npm (error|warn)|Error|ERR|gyp|ENOENT|EACCES|checksum|404|ETARGET|ERESOLVE' npm-ci.log | tail -n 40 | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Birim ve entegrasyon testleri (kapsam eşikleriyle)
        run: npm run test:coverage

  e2e:
    name: Uçtan uca (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee npm-ci.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=npm ci başarısız (çıkış $code)::$(grep -E 'npm (error|warn)|Error|ERR|gyp|ENOENT|EACCES|checksum|404|ETARGET|ERESOLVE' npm-ci.log | tail -n 40 | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-izleri
          path: test-results/
          retention-days: 7

  package:
    name: Paket (${{ matrix.name }})
    needs: [checks, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest Apple Silicon (arm64). Intel Mac için ayrı bir x64 koşucu gerekir (docs/05-FAZ1-NOTLARI.md).
          - { os: macos-latest, name: macOS, pattern: "release/*.dmg" }
          - { os: windows-latest, name: Windows, pattern: "release/*.exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Derle ve paketle
        run: npm run dist
      - name: Paketlenmiş uygulamanın duman testi
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: kurulum-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          pattern: kurulum-*
          merge-multiple: true
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la paketler
          gh release create "$TAG" paketler/* --repo "$GITHUB_REPOSITORY" --title "Universal Mail $TAG" --generate-notes --draft
