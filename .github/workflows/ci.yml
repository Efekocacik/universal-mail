name: CI

# Her dal itişinde ve PR'da kalite denetimleri ve uçtan uca test çalışır.
# macOS ve Windows kurulum paketleri burada (bulutta) derlenir; geliştirici bilgisayarı yük almaz.
# `v*` etiketi (örn. v0.1.0) itilince paketler bir GitHub Release olarak yayımlanır.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Koşucu görüntüleri açıkça sabitlenir (`*-latest` etiketleri habersiz yeni işletim sistemine geçer).
# Eylemler Node.js 24 üzerinde çalışan güncel ana sürümlerdedir (checkout v7, setup-node v7,
# upload-artifact v7, download-artifact v8).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Kalite denetimleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee npm-ci.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=npm ci başarısız (çıkış $code)::$(head -n 40 npm-ci.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Birim ve entegrasyon testleri (kapsam eşikleriyle)
        run: npm run test:coverage

  e2e:
    name: Uçtan uca (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee npm-ci.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=npm ci başarısız (çıkış $code)::$(head -n 40 npm-ci.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - run: npm run build
      # playwright.config.ts `channel: "chrome"` kullanır: koşucudaki kurulu Google Chrome yeterlidir.
      # Görüntüde Chrome yoksa (nadiren) Playwright yalnızca Chrome kanalını kurar.
      - name: Google Chrome'u doğrula
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "::warning::Google Chrome bulunamadı; Playwright ile kuruluyor."
            npx playwright install --with-deps chrome
          fi
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-izleri
          path: test-results/
          retention-days: 7

  package:
    name: Paket (${{ matrix.name }})
    needs: [checks, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 Apple Silicon (arm64). Intel Mac için ayrı bir x64 koşucu gerekir (docs/05-FAZ1-NOTLARI.md).
          - { os: macos-26, name: macOS, pattern: "release/*.dmg" }
          - { os: windows-2025, name: Windows, pattern: "release/*.exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Derle ve paketle
        run: npm run dist
      - name: Paketlenmiş uygulamanın duman testi
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        with:
          name: kurulum-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: paketler
          pattern: kurulum-*
          merge-multiple: true
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la paketler
          gh release create "$TAG" paketler/* --repo "$GITHUB_REPOSITORY" --title "Universal Mail $TAG" --generate-notes --draft
