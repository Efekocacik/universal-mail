name: CI

# Her dal itişinde ve PR'da kalite denetimleri ve uçtan uca test çalışır.
# macOS ve Windows kurulum paketleri burada (bulutta) derlenir; geliştirici bilgisayarı yük almaz.
# `v*` etiketi (örn. v0.1.0) itilince paketler bir GitHub Release olarak yayımlanır.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Koşucu görüntüleri açıkça sabitlenir (`*-latest` etiketleri habersiz yeni işletim sistemine geçer).
# Eylemler Node.js 24 üzerinde çalışan güncel ana sürümlerdedir (checkout v7, setup-node v7,
# upload-artifact v7, download-artifact v8).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Kalite denetimleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee npm-ci.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=npm ci başarısız (çıkış $code)::$(head -n 40 npm-ci.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Birim ve entegrasyon testleri (kapsam eşikleriyle)
        shell: bash
        run: |
          set +e
          npm run test:coverage 2>&1 | tee vitest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Günlük oturum açmadan okunamaz; başarısız/hata satırları ve son satırlar not olarak düşülür.
            summary=$(grep -E "FAIL|×|Error|ERROR|threshold|Unhandled|originated|Test Files|Tests " vitest.log | head -n 60 | tr '\n' '|' | cut -c1-3500)
            echo "::error title=Birim testleri başarısız (çıkış $code)::$summary"
            echo "::error title=Birim testleri: son satırlar::$(tail -n 40 vitest.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code

  e2e:
    name: Uçtan uca (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee npm-ci.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=npm ci başarısız (çıkış $code)::$(head -n 40 npm-ci.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - run: npm run build
      # playwright.config.ts `channel: "chrome"` kullanır: koşucudaki kurulu Google Chrome yeterlidir.
      # Görüntüde Chrome yoksa (nadiren) Playwright yalnızca Chrome kanalını kurar.
      - name: Google Chrome'u doğrula
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "::warning::Google Chrome bulunamadı; Playwright ile kuruluyor."
            npx playwright install --with-deps chrome
          fi
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-izleri
          path: test-results/
          retention-days: 7

  package:
    name: Paket (${{ matrix.name }})
    needs: [checks, e2e]
    runs-on: ${{ matrix.os }}
    env:
      # Yalnızca imza/notarization sırlarının TANIMLI olup olmadığı (değerleri değil) bilinir; imza doğrulama adımı buna bağlıdır.
      HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # exts: teslim edilecek dosya uzantıları (macOS: DMG ana, ZIP alternatif; ikisi AYNI derlemenin çıktısıdır).
          # Yerel modül (libsql) mimariye özgüdür: her mimari KENDİ makinesinde derlenir (universal derleme yok).
          - { os: macos-26, name: macOS-arm64, macArch: arm64, exts: "dmg,zip" }
          - { os: macos-26-intel, name: macOS-x64, macArch: x64, exts: "dmg,zip" }
          # Windows yalnızca x64: libsql için win32-arm64 ikilisi yok (Windows 11 ARM x64 paketini öykünmeyle çalıştırır).
          - { os: windows-2025, name: Windows-x64, exts: "exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Sürüm etiketi (v*) ile package.json sürümü AYNI olmalı: dosya adları (Universal-Mail-<sürüm>-…) ve Release
      # başlığı tutarlı kalır; farklıysa derleme daha başlamadan durur.
      - name: Etiket ve sürüm tutarlılığı
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$ver" ]; then
            echo "::error title=Etiket ve sürüm uyuşmuyor::Etiket $TAG, package.json sürümü $ver (beklenen v$ver)."
            exit 1
          fi
      - run: npm ci
      # İmzalama İSTEĞE BAĞLI ve varsayılan KAPALI (electron-builder.config.cjs, docs/PAKETLEME.md): depo sırları
      # tanımlı değilse değişkenler boş gelir ve paket bugünkü gibi imzasız üretilir. Sırlar günlüğe yazılmaz.
      # Sertifika verilmediyse yapılandırma `mac.identity: null` ile koşucunun anahtarlığındaki bir kimliği de kullanmaz.
      - name: Derle ve paketle
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          UM_MAC_ARCH: ${{ matrix.macArch }}
      - name: Paketlenmiş uygulamanın duman testi
        run: npm run smoke
      # İmza sırları tanımlıysa: imza, sertleştirilmiş çalışma zamanı, Gatekeeper değerlendirmesi ve notarization bileti
      # (stapler) DOĞRULANIR; sırlar yoksa atlanır ve paket imzasız kalır (imza kararı açıkça verilmelidir).
      - name: macOS imza ve notarization doğrulaması
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        shell: bash
        run: |
          app=$(ls -d release/mac*/"Universal Mail.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" >/dev/null
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      # Windows: imzasız derlemede de simge ve sürüm bilgisi .exe'ye gömülü olmalı (kısayollar Universal Mail simgesini taşır).
      - name: Windows .exe simge ve sürüm bilgisi
        if: runner.os == 'Windows'
        run: node scripts/check-win-exe.mjs
      # Teslim edilecek dosyalar tek klasörde toplanır ve SHA-256 özetleri BU derlemeden üretilir. Test edilen dosyanın
      # müşteriye verilenle aynı olduğu bu özetle (shasum -a 256) doğrulanır. Özetler artifact ile birlikte saklanır.
      - name: Teslimat dosyalarını topla ve SHA-256 üret
        shell: bash
        env:
          EXTS: ${{ matrix.exts }}
          OS_NAME: ${{ matrix.name }}
        run: |
          mkdir -p teslimat
          for e in ${EXTS//,/ }; do cp release/*."$e" teslimat/; done
          node scripts/make-checksums.mjs teslimat "teslimat/SHA256SUMS-$OS_NAME.txt" "$EXTS"
          cd teslimat
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c "SHA256SUMS-$OS_NAME.txt"; else shasum -a 256 -c "SHA256SUMS-$OS_NAME.txt"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: kurulum-${{ matrix.name }}
          path: teslimat/
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: paketler
          pattern: kurulum-*
          merge-multiple: true
      # Aşamalar arası bütünlük: indirilen dosyalar paket işinde üretilen özetlerle birebir eşleşmeli.
      - name: Özetleri doğrula
        shell: bash
        working-directory: paketler
        run: |
          ls -la
          for f in SHA256SUMS-*.txt; do sha256sum -c "$f"; done
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
      # Release HER ZAMAN TASLAK oluşur (--draft). Test edilen dosyalar bu taslağın dosyalarıdır; yayımlama yalnızca
      # taslağı açar, dosyalar değişmez (yeniden derleme yok). Bkz. docs/PAKETLEME.md "Teslimat süreci".
      - name: Release oluştur (taslak)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## SHA-256"
            echo
            echo '```'
            cat paketler/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" paketler/* --repo "$GITHUB_REPOSITORY" --title "Universal Mail $TAG" --notes-file notes.md --generate-notes --draft
